test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# Production Active Storage only. Credentials come from CLOUDINARY_URL
# (cloudinary://API_KEY:API_SECRET@CLOUD_NAME) or CLOUDINARY_CLOUD_NAME /
# CLOUDINARY_API_KEY / CLOUDINARY_API_SECRET. The Cloudinary service infers
# resource type from content type (images, PDFs, and other files).
cloudinary:
  service: Cloudinary
  api_key: <%= ENV.fetch("CLOUDINARY_API_KEY") %>
  api_secret: <%= ENV.fetch("API_SECRET") %>
  cloud_name: <%= ENV.fetch("CLOUDINARY_CLOUD_NAME") %>
  folder: <%= ENV.fetch("CLOUDINARY_FOLDER", "dinehub") %>

# Remember not to checkin your GCS keyfile to a repository
# google:
#   service: GCS
#   project: your_project
#   credentials: <%= Rails.root.join("path/to/gcs.keyfile") %>
#   bucket: your_own_bucket-<%= Rails.env %>

