---
openapi: 3.0.3
info:
  title: Dinehub API
  version: v1
  description: |
    Restaurant public API. Use **Try it out** to call endpoints against this server.

    Table reservations hold a 2-hour dining window. Arrival times must be on a 30-minute slot (e.g. `18:00`, `18:30`).
servers:
- url: "/"
  description: Current host
tags:
- name: Menus
- name: Menu categories
- name: Menu items
- name: Specials
- name: Events
- name: Tables
- name: Reservations
- name: Careers
- name: Auth
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    CookieAuth:
      type: apiKey
      in: cookie
      name: jwt
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
  schemas:
    DrinkType:
      type: string
      enum:
      - beer
      - wine
      - cocktails
      - spirits
      - whiskey
    Location:
      type: string
      enum:
      - Cocktail Bar
      - Covered Patio
      - Dining Room
      - Snug
    MenuCategoryType:
      type: string
      enum:
      - our_menu
      - specials
      - drinks
    Error:
      type: object
      properties:
        error:
          type: string
    Errors:
      type: object
      properties:
        errors:
          type: array
          items:
            type: string
    Menu:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        category_type:
          "$ref": "#/components/schemas/MenuCategoryType"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    MenuCategory:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        menu_id:
          type: integer
        drink_type:
          nullable: true
          allOf:
          - "$ref": "#/components/schemas/DrinkType"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    MenuItem:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        price:
          type: string
          example: '12.50'
        start_at:
          type: string
          format: date-time
          nullable: true
        end_at:
          type: string
          format: date-time
          nullable: true
        menu_category_id:
          type: integer
        image_url:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SpecialsWeek:
      type: object
      properties:
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        menu:
          nullable: true
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
            category_type:
              "$ref": "#/components/schemas/MenuCategoryType"
        menu_items:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              description:
                type: string
                nullable: true
              price:
                type: string
              start_at:
                type: string
                format: date-time
                nullable: true
              end_at:
                type: string
                format: date-time
                nullable: true
              menu_category_id:
                type: integer
              menu_category_name:
                type: string
              image_url:
                type: string
                nullable: true
    Event:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    EventItem:
      type: object
      properties:
        id:
          type: integer
        event_id:
          type: integer
        title:
          type: string
        description:
          type: string
          nullable: true
        event_date:
          type: string
          format: date
        start_time:
          type: string
          nullable: true
        end_time:
          type: string
          nullable: true
        logo_url:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    EventWithItems:
      allOf:
      - "$ref": "#/components/schemas/Event"
      - type: object
        properties:
          event_items:
            type: array
            items:
              "$ref": "#/components/schemas/EventItem"
    TableAvailability:
      type: object
      properties:
        date:
          type: string
          format: date
        start_time:
          type: string
        locations:
          type: array
          items:
            type: object
            properties:
              location:
                "$ref": "#/components/schemas/Location"
              available_tables:
                type: integer
    TableReservationRequest:
      type: object
      required:
      - location
      - reservation_date
      - start_time
      properties:
        location:
          "$ref": "#/components/schemas/Location"
        reservation_date:
          type: string
          format: date
        start_time:
          type: string
          example: '18:00'
        number_of_people:
          type: integer
        first_name:
          type: string
        last_name:
          type: string
        full_name:
          type: string
          description: Used if first/last name are omitted
        email:
          type: string
          format: email
        phone:
          type: string
        occasion:
          type: string
        special_requests:
          type: string
        marketing_opt_in:
          type: boolean
    TableReservation:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          example: TableReservation
        location:
          "$ref": "#/components/schemas/Location"
        reservation_date:
          type: string
          format: date
        start_time:
          type: string
        estimated_end_time:
          type: string
        number_of_people:
          type: integer
          nullable: true
        full_name:
          type: string
        email:
          type: string
        phone:
          type: string
        occasion:
          type: string
          nullable: true
        special_requests:
          type: string
          nullable: true
        marketing_opt_in:
          type: boolean
    InquiryReservationRequest:
      type: object
      properties:
        full_name:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        company:
          type: string
        reservation_date:
          type: string
          format: date
        start_time:
          type: string
        duration:
          type: string
          example: 2 hours
        budget_per_person:
          type: number
        number_of_people:
          type: integer
        occasion:
          type: string
        description:
          type: string
        special_requests:
          type: string
        source:
          type: string
        marketing_opt_in:
          type: boolean
    InquiryReservation:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          example: PartiesReservation
        full_name:
          type: string
        phone:
          type: string
        email:
          type: string
        company:
          type: string
          nullable: true
        reservation_date:
          type: string
          format: date
        start_time:
          type: string
        duration:
          type: string
        budget_per_person:
          type: string
        number_of_people:
          type: integer
        occasion:
          type: string
        description:
          type: string
          nullable: true
        special_requests:
          type: string
          nullable: true
        source:
          type: string
        marketing_opt_in:
          type: boolean
    CareerRequest:
      type: object
      required:
      - full_name
      - email
      - phone
      - experience
      properties:
        full_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        opt_in:
          type: boolean
        experience:
          type: string
        cover_letter:
          type: string
        resume_link:
          type: string
    Career:
      type: object
      properties:
        id:
          type: integer
        full_name:
          type: string
        email:
          type: string
        phone:
          type: string
        opt_in:
          type: boolean
        experience:
          type: string
        cover_letter:
          type: string
          nullable: true
        resume_link:
          type: string
          nullable: true
    RegisterRequest:
      type: object
      required:
      - first_name
      - last_name
      - email
      - phone
      - password
      properties:
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        password:
          type: string
          format: password
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    ForgotPasswordRequest:
      type: object
      required:
      - email
      properties:
        email:
          type: string
          format: email
    ResetPasswordRequest:
      type: object
      required:
      - token
      - password
      properties:
        token:
          type: string
        password:
          type: string
          format: password
        password_confirmation:
          type: string
          format: password
    User:
      type: object
      properties:
        id:
          type: integer
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
        phone:
          type: string
    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          "$ref": "#/components/schemas/User"
  responses:
    NotFound:
      description: Record not found
    Unprocessable:
      description: Validation failed
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Errors"
    ServerError:
      description: Unexpected error
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
paths:
  "/api/v1/auth/register":
    post:
      summary: Register a user
      tags:
      - Auth
      parameters: []
      responses:
        '201':
          description: user registered
        '422':
          description: validation failed
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RegisterRequest"
  "/api/v1/auth/login":
    post:
      summary: Log in
      tags:
      - Auth
      parameters: []
      responses:
        '200':
          description: authenticated
        '401':
          description: invalid credentials
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/LoginRequest"
  "/api/v1/auth/logout":
    delete:
      summary: Log out
      tags:
      - Auth
      responses:
        '204':
          description: logged out
  "/api/v1/auth/me":
    get:
      summary: Get the current user
      tags:
      - Auth
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: current user
        '401':
          description: unauthorized
  "/api/v1/auth/forgot_password":
    post:
      summary: Request a password reset
      tags:
      - Auth
      parameters: []
      responses:
        '200':
          description: reset instructions sent
        '404':
          description: email not found
        '422':
          description: email is missing
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ForgotPasswordRequest"
  "/api/v1/auth/reset_password":
    post:
      summary: Reset password with a token
      tags:
      - Auth
      parameters: []
      responses:
        '200':
          description: password updated
        '422':
          description: token is invalid or expired
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ResetPasswordRequest"
  "/api/v1/careers":
    post:
      summary: Submit a job application
      tags:
      - Careers
      parameters: []
      responses:
        '201':
          description: application submitted
        '422':
          description: validation failed
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CareerRequest"
  "/api/v1/menus":
    get:
      summary: List menus
      tags:
      - Menus
      responses:
        '200':
          description: menus returned
  "/api/v1/menus/{id}":
    get:
      summary: Get a menu
      tags:
      - Menus
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: menu returned
        '404':
          description: menu not found
  "/api/v1/menu_categories":
    get:
      summary: List menu categories
      tags:
      - Menu categories
      parameters:
      - name: menu_id
        in: query
        required: false
        schema:
          type: integer
      - name: drink_type
        in: query
        schema:
          "$ref": "#/components/schemas/DrinkType"
        required: false
      responses:
        '200':
          description: categories returned
  "/api/v1/menu_categories/{id}":
    get:
      summary: Get a menu category
      tags:
      - Menu categories
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: category returned
        '404':
          description: category not found
  "/api/v1/menu_items":
    get:
      summary: List menu items
      tags:
      - Menu items
      parameters:
      - name: menu_category_id
        in: query
        required: false
        schema:
          type: integer
      - name: drink_type
        in: query
        schema:
          "$ref": "#/components/schemas/DrinkType"
        required: false
      responses:
        '200':
          description: items returned
  "/api/v1/menu_items/{id}":
    get:
      summary: Get a menu item
      tags:
      - Menu items
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: item returned
        '404':
          description: item not found
  "/api/v1/events":
    get:
      summary: List events
      tags:
      - Events
      responses:
        '200':
          description: events returned
  "/api/v1/events/{id}":
    get:
      summary: Get an event with its items
      tags:
      - Events
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: event returned
        '404':
          description: event not found
  "/api/v1/specials":
    get:
      summary: List this week's specials
      tags:
      - Specials
      responses:
        '200':
          description: specials returned
  "/api/v1/parties_reservations":
    post:
      summary: Create a parties inquiry
      tags:
      - Reservations
      parameters: []
      responses:
        '201':
          description: inquiry created
        '422':
          description: validation failed
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/InquiryReservationRequest"
  "/api/v1/catering_reservations":
    post:
      summary: Create a catering inquiry
      tags:
      - Reservations
      parameters: []
      responses:
        '201':
          description: inquiry created
        '422':
          description: validation failed
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/InquiryReservationRequest"
  "/api/v1/reservations":
    post:
      summary: Create a dining table reservation
      tags:
      - Reservations
      parameters: []
      responses:
        '201':
          description: reservation created
        '422':
          description: validation failed or no table is available
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/TableReservationRequest"
  "/api/v1/tables":
    get:
      summary: List table availability by location
      tags:
      - Tables
      parameters:
      - name: date
        in: query
        format: date
        required: true
        schema:
          type: string
      - name: start_time
        in: query
        required: true
        schema:
          type: string
      - name: location
        in: query
        schema:
          "$ref": "#/components/schemas/Location"
        required: false
      - name: capacity
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: availability returned
        '400':
          description: date or start time is missing
