---
openapi: 3.0.3
info:
  title: Dinehub API
  version: v1
  description: |
    Restaurant public API. Use **Try it out** to call endpoints against this server.

    Table reservations hold a 2-hour dining window. Arrival times must be on a 30-minute slot (e.g. `18:00`, `18:30`).
servers:
- url: "/"
  description: Current host
tags:
- name: Menus
- name: Menu categories
- name: Menu items
- name: Specials
- name: Events
- name: Tables
- name: Reservations
- name: Careers
- name: Auth
- name: Cart
- name: Delivery addresses
- name: Orders
- name: Deliveries
- name: Payments
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    CookieAuth:
      type: apiKey
      in: cookie
      name: jwt
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
  schemas:
    DrinkType:
      type: string
      enum:
      - beer
      - wine
      - cocktails
      - spirits
      - whiskey
    Location:
      type: string
      enum:
      - Cocktail Bar
      - Covered Patio
      - Dining Room
      - Snug
    MenuCategoryType:
      type: string
      enum:
      - our_menu
      - specials
      - drinks
    Error:
      type: object
      properties:
        error:
          type: string
    Errors:
      type: object
      properties:
        errors:
          type: array
          items:
            type: string
    Menu:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        category_type:
          "$ref": "#/components/schemas/MenuCategoryType"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    MenuCategory:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        menu_id:
          type: integer
        drink_type:
          nullable: true
          allOf:
          - "$ref": "#/components/schemas/DrinkType"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    MenuItem:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        price:
          type: string
          example: '12.50'
        start_at:
          type: string
          format: date-time
          nullable: true
        end_at:
          type: string
          format: date-time
          nullable: true
        menu_category_id:
          type: integer
        image_url:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SpecialsWeek:
      type: object
      properties:
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        menu:
          nullable: true
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
            category_type:
              "$ref": "#/components/schemas/MenuCategoryType"
        menu_items:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              description:
                type: string
                nullable: true
              price:
                type: string
              start_at:
                type: string
                format: date-time
                nullable: true
              end_at:
                type: string
                format: date-time
                nullable: true
              menu_category_id:
                type: integer
              menu_category_name:
                type: string
              image_url:
                type: string
                nullable: true
    Event:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    EventItem:
      type: object
      properties:
        id:
          type: integer
        event_id:
          type: integer
        title:
          type: string
        description:
          type: string
          nullable: true
        event_date:
          type: string
          format: date
        start_time:
          type: string
          nullable: true
        end_time:
          type: string
          nullable: true
        logo_url:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    EventWithItems:
      allOf:
      - "$ref": "#/components/schemas/Event"
      - type: object
        properties:
          event_items:
            type: array
            items:
              "$ref": "#/components/schemas/EventItem"
    TableAvailability:
      type: object
      properties:
        date:
          type: string
          format: date
        start_time:
          type: string
        locations:
          type: array
          items:
            type: object
            properties:
              location:
                "$ref": "#/components/schemas/Location"
              available_tables:
                type: integer
    TableReservationRequest:
      type: object
      required:
      - location
      - reservation_date
      - start_time
      properties:
        location:
          "$ref": "#/components/schemas/Location"
        reservation_date:
          type: string
          format: date
        start_time:
          type: string
          example: '18:00'
        number_of_people:
          type: integer
        first_name:
          type: string
        last_name:
          type: string
        full_name:
          type: string
          description: Used if first/last name are omitted
        email:
          type: string
          format: email
        phone:
          type: string
        occasion:
          type: string
        special_requests:
          type: string
        marketing_opt_in:
          type: boolean
    TableReservation:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          example: TableReservation
        location:
          "$ref": "#/components/schemas/Location"
        reservation_date:
          type: string
          format: date
        start_time:
          type: string
        estimated_end_time:
          type: string
        number_of_people:
          type: integer
          nullable: true
        full_name:
          type: string
        email:
          type: string
        phone:
          type: string
        occasion:
          type: string
          nullable: true
        special_requests:
          type: string
          nullable: true
        marketing_opt_in:
          type: boolean
    InquiryReservationRequest:
      type: object
      properties:
        full_name:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        company:
          type: string
        reservation_date:
          type: string
          format: date
        start_time:
          type: string
        duration:
          type: string
          example: 2 hours
        budget_per_person:
          type: number
        number_of_people:
          type: integer
        occasion:
          type: string
        description:
          type: string
        special_requests:
          type: string
        source:
          type: string
        marketing_opt_in:
          type: boolean
    InquiryReservation:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          example: PartiesReservation
        full_name:
          type: string
        phone:
          type: string
        email:
          type: string
        company:
          type: string
          nullable: true
        reservation_date:
          type: string
          format: date
        start_time:
          type: string
        duration:
          type: string
        budget_per_person:
          type: string
        number_of_people:
          type: integer
        occasion:
          type: string
        description:
          type: string
          nullable: true
        special_requests:
          type: string
          nullable: true
        source:
          type: string
        marketing_opt_in:
          type: boolean
    CareerRequest:
      type: object
      required:
      - full_name
      - email
      - phone
      - experience
      properties:
        full_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        opt_in:
          type: boolean
        experience:
          type: string
        cover_letter:
          type: string
        resume_link:
          type: string
    Career:
      type: object
      properties:
        id:
          type: integer
        full_name:
          type: string
        email:
          type: string
        phone:
          type: string
        opt_in:
          type: boolean
        experience:
          type: string
        cover_letter:
          type: string
          nullable: true
        resume_link:
          type: string
          nullable: true
    RegisterRequest:
      type: object
      required:
      - first_name
      - last_name
      - email
      - phone
      - password
      properties:
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        password:
          type: string
          format: password
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    ForgotPasswordRequest:
      type: object
      required:
      - email
      properties:
        email:
          type: string
          format: email
    ResetPasswordRequest:
      type: object
      required:
      - token
      - password
      properties:
        token:
          type: string
        password:
          type: string
          format: password
        password_confirmation:
          type: string
          format: password
    User:
      type: object
      properties:
        id:
          type: integer
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
        phone:
          type: string
    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          "$ref": "#/components/schemas/User"
    UpdateProfileRequest:
      type: object
      properties:
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
        phone:
          type: string
        additional_phone:
          type: string
          nullable: true
        password:
          type: string
          format: password
    OrderStatus:
      type: string
      enum:
      - pending
      - confirmed
      - preparing
      - ready
      - completed
      - cancelled
    PaymentStatus:
      type: string
      enum:
      - pending
      - processing
      - successful
      - failed
      - cancelled
    DeliveryStatus:
      type: string
      enum:
      - pending
      - requested
      - assigned
      - picked_up
      - out_for_delivery
      - delivered
      - cancelled
      - failed
    CartItem:
      type: object
      properties:
        id:
          type: integer
        cart_id:
          type: integer
        menu_item_id:
          type: integer
        quantity:
          type: integer
        unit_price:
          type: string
          example: '8.50'
        menu_item:
          "$ref": "#/components/schemas/MenuItem"
    Cart:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        status:
          type: string
          enum:
          - active
          - completed
        deleted_at:
          type: string
          format: date-time
          nullable: true
        cart_items:
          type: array
          items:
            "$ref": "#/components/schemas/CartItem"
    CartItemsRequest:
      type: object
      required:
      - cart_items
      properties:
        cart_items:
          type: array
          items:
            type: object
            required:
            - menu_item_id
            - quantity
            properties:
              menu_item_id:
                type: integer
              quantity:
                type: integer
    CartItemUpdateRequest:
      type: object
      required:
      - cart_item
      properties:
        cart_item:
          type: object
          required:
          - quantity
          properties:
            quantity:
              type: integer
    DeliveryAddress:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        address_line:
          type: string
        landmark:
          type: string
          nullable: true
        city:
          type: string
        state:
          type: string
        postal_code:
          type: string
        latitude:
          type: string
          nullable: true
        longitude:
          type: string
          nullable: true
        is_default:
          type: boolean
    DeliveryAddressRequest:
      type: object
      required:
      - delivery_address
      properties:
        delivery_address:
          type: object
          required:
          - address_line
          - city
          - state
          - postal_code
          properties:
            address_line:
              type: string
            landmark:
              type: string
            city:
              type: string
            state:
              type: string
            postal_code:
              type: string
            latitude:
              type: number
            longitude:
              type: number
            is_default:
              type: boolean
    OrderItem:
      type: object
      properties:
        id:
          type: integer
        order_id:
          type: integer
        menu_item_id:
          type: integer
        name:
          type: string
        quantity:
          type: integer
        unit_price:
          type: string
        total_price:
          type: string
    Payment:
      type: object
      properties:
        id:
          type: integer
        order_id:
          type: integer
          nullable: true
        cart_id:
          type: integer
        delivery_address_id:
          type: integer
          nullable: true
        gateway:
          type: string
          example: cashfree
        amount:
          type: string
          example: '20.0'
        currency:
          type: string
          example: INR
        status:
          "$ref": "#/components/schemas/PaymentStatus"
        payment_session_id:
          type: string
          nullable: true
        gateway_order_id:
          type: string
          nullable: true
    Order:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        cart_id:
          type: integer
        delivery_address_id:
          type: integer
          nullable: true
        status:
          "$ref": "#/components/schemas/OrderStatus"
        subtotal:
          type: string
        tax:
          type: string
        total:
          type: string
        order_items:
          type: array
          items:
            "$ref": "#/components/schemas/OrderItem"
        payment:
          "$ref": "#/components/schemas/Payment"
    OrderStatusRequest:
      type: object
      required:
      - status
      properties:
        status:
          "$ref": "#/components/schemas/OrderStatus"
    Delivery:
      type: object
      properties:
        id:
          type: integer
        order_id:
          type: integer
        provider:
          type: string
          nullable: true
        status:
          "$ref": "#/components/schemas/DeliveryStatus"
        tracking_url:
          type: string
          nullable: true
        external_order_id:
          type: string
          nullable: true
    CheckoutRequest:
      type: object
      required:
      - cart_id
      - delivery_address_id
      properties:
        cart_id:
          type: integer
        delivery_address_id:
          type: integer
    CheckoutResponse:
      type: object
      properties:
        payment:
          type: object
          properties:
            id:
              type: integer
            gateway:
              type: string
            amount:
              type: string
            currency:
              type: string
            status:
              "$ref": "#/components/schemas/PaymentStatus"
            payment_session_id:
              type: string
              nullable: true
    PaymentReturn:
      type: object
      properties:
        message:
          type: string
        order_id:
          type: integer
          nullable: true
        gateway_order_id:
          type: string
    CashfreeWebhook:
      type: object
      properties:
        type:
          type: string
          example: PAYMENT_SUCCESS_WEBHOOK
        data:
          type: object
          properties:
            order:
              type: object
              properties:
                order_id:
                  type: string
                  description: Gateway order id stored on the payment, for example
                    CHECKOUT_1
                order_amount:
                  type: number
            payment:
              type: object
              properties:
                cf_payment_id:
                  type: integer
                payment_status:
                  type: string
                  enum:
                  - SUCCESS
                  - FAILED
                  - USER_DROPPED
                  - CANCELLED
                  - VOID
                  - PENDING
                  - NOT_ATTEMPTED
  responses:
    NotFound:
      description: Record not found
    Unprocessable:
      description: Validation failed
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Errors"
    ServerError:
      description: Unexpected error
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
paths:
  "/api/v1/auth/register":
    post:
      summary: Register a user
      tags:
      - Auth
      parameters: []
      responses:
        '201':
          description: user registered
        '422':
          description: validation failed
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RegisterRequest"
  "/api/v1/auth/login":
    post:
      summary: Log in
      tags:
      - Auth
      parameters: []
      responses:
        '200':
          description: authenticated
        '401':
          description: invalid credentials
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/LoginRequest"
  "/api/v1/auth/logout":
    delete:
      summary: Log out
      tags:
      - Auth
      responses:
        '204':
          description: logged out
  "/api/v1/auth/me":
    get:
      summary: Get the current user
      tags:
      - Auth
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: current user
        '401':
          description: unauthorized
  "/api/v1/auth/forgot_password":
    post:
      summary: Request a password reset
      tags:
      - Auth
      parameters: []
      responses:
        '200':
          description: reset instructions sent
        '404':
          description: email not found
        '422':
          description: email is missing
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ForgotPasswordRequest"
  "/api/v1/auth/reset_password":
    post:
      summary: Reset password with a token
      tags:
      - Auth
      parameters: []
      responses:
        '200':
          description: password updated
        '422':
          description: token is invalid or expired
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ResetPasswordRequest"
  "/api/v1/profile":
    patch:
      summary: Update the current user's profile
      tags:
      - Auth
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: profile updated
        '422':
          description: validation failed
        '401':
          description: unauthorized
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UpdateProfileRequest"
  "/api/v1/careers":
    post:
      summary: Submit a job application
      tags:
      - Careers
      parameters: []
      responses:
        '201':
          description: application submitted
        '422':
          description: validation failed
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CareerRequest"
  "/api/v1/cart":
    get:
      summary: Get the current cart
      tags:
      - Cart
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: cart returned
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Cart"
        '401':
          description: unauthorized
    delete:
      summary: Clear the current cart
      tags:
      - Cart
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: cart cleared
        '401':
          description: unauthorized
  "/api/v1/cart/items":
    post:
      summary: Add items to the cart
      tags:
      - Cart
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
      responses:
        '201':
          description: items added
        '404':
          description: menu item not found
        '422':
          description: cart is checked out
        '401':
          description: unauthorized
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CartItemsRequest"
  "/api/v1/cart/items/{id}":
    patch:
      summary: Update a cart item quantity
      tags:
      - Cart
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: quantity updated
        '422':
          description: quantity is invalid
        '404':
          description: cart item not found
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CartItemUpdateRequest"
    delete:
      summary: Remove a cart item
      tags:
      - Cart
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: item removed
        '404':
          description: cart item not found
  "/api/v1/payments/cashfree/webhook":
    post:
      summary: Cashfree payment result
      tags:
      - Payments
      parameters:
      - name: x-webhook-signature
        in: header
        required: true
        schema:
          type: string
      - name: x-webhook-timestamp
        in: header
        required: true
        schema:
          type: string
      responses:
        '401':
          description: invalid signature
        '400':
          description: order id is missing
        '404':
          description: payment not found
        '200':
          description: payment applied and order created
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CashfreeWebhook"
  "/api/v1/menus":
    get:
      summary: List menus
      tags:
      - Menus
      responses:
        '200':
          description: menus returned
  "/api/v1/menus/{id}":
    get:
      summary: Get a menu
      tags:
      - Menus
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: menu returned
        '404':
          description: menu not found
  "/api/v1/menu_categories":
    get:
      summary: List menu categories
      tags:
      - Menu categories
      parameters:
      - name: menu_id
        in: query
        required: false
        schema:
          type: integer
      - name: drink_type
        in: query
        schema:
          "$ref": "#/components/schemas/DrinkType"
        required: false
      responses:
        '200':
          description: categories returned
  "/api/v1/menu_categories/{id}":
    get:
      summary: Get a menu category
      tags:
      - Menu categories
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: category returned
        '404':
          description: category not found
  "/api/v1/menu_items":
    get:
      summary: List menu items
      tags:
      - Menu items
      parameters:
      - name: menu_category_id
        in: query
