---
openapi: 3.0.3
info:
  title: Dinehub API
  version: v1
  description: |
    Restaurant public API. Use **Try it out** to call endpoints against this server.

    Admin endpoints require a user with the admin role. Send the JWT as a Bearer token or the `jwt` cookie.

    Table reservations hold a dining window (2 hours by default). Admins can change that window. Arrival times must be on a 30-minute slot (e.g. `18:00`, `18:30`).

    Admin list endpoints are paginated. Use `page` (default 1) and `per_page` (default 25, maximum 100).
servers:
- url: "/"
  description: Current host
tags:
- name: Menus
- name: Menu categories
- name: Menu items
- name: Specials
- name: Events
- name: Tables
- name: Reservations
- name: Careers
- name: Auth
- name: Cart
- name: Delivery addresses
- name: Orders
- name: Deliveries
- name: Payments
- name: Admin menus
- name: Admin menu categories
- name: Admin menu items
- name: Admin customers
- name: Admin orders
- name: Admin tables
- name: Admin table reservations
- name: Admin catering
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    CookieAuth:
      type: apiKey
      in: cookie
      name: jwt
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
    Page:
      name: page
      in: query
      required: false
      description: Page number. Defaults to 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      required: false
      description: Page size. Defaults to 25 and cannot exceed 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  schemas:
    DrinkType:
      type: string
      enum:
      - beer
      - wine
      - cocktails
      - spirits
      - whiskey
    Location:
      type: string
      enum:
      - Cocktail Bar
      - Covered Patio
      - Dining Room
      - Snug
    MenuCategoryType:
      type: string
      enum:
      - our_menu
      - specials
      - drinks
    Error:
      type: object
      properties:
        error:
          type: string
    Errors:
      type: object
      properties:
        errors:
          type: array
          items:
            type: string
    Menu:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        category_type:
          "$ref": "#/components/schemas/MenuCategoryType"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    MenuCategory:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        menu_id:
          type: integer
        drink_type:
          nullable: true
          allOf:
          - "$ref": "#/components/schemas/DrinkType"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    MenuItem:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        price:
          type: string
          example: '12.50'
        start_at:
          type: string
          format: date-time
          nullable: true
        end_at:
          type: string
          format: date-time
          nullable: true
        menu_category_id:
          type: integer
        image_url:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SpecialsWeek:
      type: object
      properties:
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        menu:
          nullable: true
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
            category_type:
              "$ref": "#/components/schemas/MenuCategoryType"
        menu_items:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              description:
                type: string
                nullable: true
              price:
                type: string
              start_at:
                type: string
                format: date-time
                nullable: true
              end_at:
                type: string
                format: date-time
                nullable: true
              menu_category_id:
                type: integer
              menu_category_name:
                type: string
              image_url:
                type: string
                nullable: true
    Event:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    EventItem:
      type: object
      properties:
        id:
          type: integer
        event_id:
          type: integer
        title:
          type: string
        description:
          type: string
          nullable: true
        event_date:
          type: string
          format: date
        start_time:
          type: string
          nullable: true
        end_time:
          type: string
          nullable: true
        logo_url:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    EventWithItems:
      allOf:
      - "$ref": "#/components/schemas/Event"
      - type: object
        properties:
          event_items:
            type: array
            items:
              "$ref": "#/components/schemas/EventItem"
    TableAvailability:
      type: object
      properties:
        date:
          type: string
          format: date
        start_time:
          type: string
        locations:
          type: array
          items:
            type: object
            properties:
              location:
                "$ref": "#/components/schemas/Location"
              available_tables:
                type: integer
    TableReservationRequest:
      type: object
      required:
      - location
      - reservation_date
      - start_time
      properties:
        location:
          "$ref": "#/components/schemas/Location"
        reservation_date:
          type: string
          format: date
        start_time:
          type: string
          example: '18:00'
        number_of_people:
          type: integer
        first_name:
          type: string
        last_name:
          type: string
        full_name:
          type: string
          description: Used if first/last name are omitted
        email:
          type: string
          format: email
        phone:
          type: string
        occasion:
          type: string
        special_requests:
          type: string
        marketing_opt_in:
          type: boolean
    TableReservation:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          example: TableReservation
        location:
          "$ref": "#/components/schemas/Location"
        reservation_date:
          type: string
          format: date
        start_time:
          type: string
        estimated_end_time:
          type: string
        number_of_people:
          type: integer
          nullable: true
        full_name:
          type: string
        email:
          type: string
        phone:
          type: string
        occasion:
          type: string
          nullable: true
        special_requests:
          type: string
          nullable: true
        marketing_opt_in:
          type: boolean
    InquiryReservationRequest:
      type: object
      properties:
        full_name:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        company:
          type: string
        reservation_date:
          type: string
          format: date
        start_time:
          type: string
        duration:
          type: string
          example: 2 hours
        budget_per_person:
          type: number
        number_of_people:
          type: integer
        occasion:
          type: string
        description:
          type: string
        special_requests:
          type: string
        source:
          type: string
        marketing_opt_in:
          type: boolean
    InquiryReservation:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          example: PartiesReservation
        full_name:
          type: string
        phone:
          type: string
        email:
          type: string
        company:
          type: string
          nullable: true
        reservation_date:
          type: string
          format: date
        start_time:
          type: string
        duration:
          type: string
        budget_per_person:
          type: string
        number_of_people:
          type: integer
        occasion:
          type: string
        description:
          type: string
          nullable: true
        special_requests:
          type: string
          nullable: true
        source:
          type: string
        marketing_opt_in:
          type: boolean
    CareerRequest:
      type: object
      required:
      - full_name
      - email
      - phone
      - experience
      properties:
        full_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        opt_in:
          type: boolean
        experience:
          type: string
        cover_letter:
          type: string
        resume_link:
          type: string
        job_id:
          type: integer
          nullable: true
          description: Optional job this application belongs to
    Career:
      type: object
      properties:
        id:
          type: integer
        full_name:
          type: string
        email:
          type: string
        phone:
          type: string
        opt_in:
          type: boolean
        experience:
          type: string
        cover_letter:
          type: string
          nullable: true
        resume_link:
          type: string
          nullable: true
    RegisterRequest:
      type: object
      required:
      - first_name
      - last_name
      - email
      - phone
      - password
      properties:
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        password:
          type: string
          format: password
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    ForgotPasswordRequest:
      type: object
      required:
      - email
      properties:
        email:
          type: string
          format: email
    ResetPasswordRequest:
      type: object
      required:
      - token
      - password
      properties:
        token:
          type: string
        password:
          type: string
          format: password
        password_confirmation:
          type: string
          format: password
    UserRole:
      type: string
      enum:
      - customer
      - admin
    User:
      type: object
      properties:
        id:
          type: integer
        first_name:
          type: string
        last_name:
          type: string
        full_name:
          type: string
        email:
          type: string
        phone:
          type: string
        additional_phone:
          type: string
          nullable: true
        role:
          "$ref": "#/components/schemas/UserRole"
        profile_image:
          type: string
          nullable: true
    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          "$ref": "#/components/schemas/User"
    UpdateProfileRequest:
      type: object
      properties:
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
        phone:
          type: string
        additional_phone:
          type: string
          nullable: true
        password:
          type: string
          format: password
    OrderStatus:
      type: string
      enum:
      - pending
      - confirmed
      - preparing
      - ready
      - completed
      - cancelled
    PaymentStatus:
      type: string
      enum:
      - pending
      - processing
      - successful
      - failed
      - cancelled
    DeliveryStatus:
      type: string
      enum:
      - pending
      - requested
      - assigned
      - picked_up
      - out_for_delivery
      - delivered
      - cancelled
      - failed
    CartItem:
      type: object
      properties:
        id:
          type: integer
        cart_id:
          type: integer
        menu_item_id:
          type: integer
        quantity:
          type: integer
        unit_price:
          type: string
          example: '8.50'
        menu_item:
          "$ref": "#/components/schemas/MenuItem"
    Cart:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        status:
          type: string
          enum:
          - active
          - completed
        deleted_at:
          type: string
          format: date-time
          nullable: true
        cart_items:
          type: array
          items:
            "$ref": "#/components/schemas/CartItem"
    CartItemsRequest:
      type: object
      required:
      - cart_items
      properties:
        cart_items:
          type: array
          items:
            type: object
            required:
            - menu_item_id
            - quantity
            properties:
              menu_item_id:
                type: integer
              quantity:
                type: integer
    CartItemUpdateRequest:
      type: object
      required:
      - cart_item
      properties:
        cart_item:
          type: object
          required:
          - quantity
          properties:
            quantity:
              type: integer
    DeliveryAddress:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        address_line:
          type: string
        landmark:
          type: string
          nullable: true
        city:
          type: string
        state:
          type: string
        postal_code:
          type: string
        latitude:
          type: string
          nullable: true
        longitude:
          type: string
          nullable: true
        is_default:
          type: boolean
    DeliveryAddressRequest:
      type: object
      required:
      - delivery_address
      properties:
        delivery_address:
          type: object
          required:
          - address_line
          - city
          - state
          - postal_code
          properties:
            address_line:
              type: string
            landmark:
              type: string
            city:
              type: string
            state:
              type: string
            postal_code:
              type: string
            latitude:
              type: number
            longitude:
              type: number
            is_default:
              type: boolean
    OrderItem:
      type: object
      properties:
        id:
          type: integer
        order_id:
          type: integer
        menu_item_id:
          type: integer
        name:
          type: string
        quantity:
          type: integer
        unit_price:
          type: string
        total_price:
          type: string
    Payment:
      type: object
      properties:
        id:
          type: integer
        order_id:
          type: integer
          nullable: true
        cart_id:
          type: integer
        delivery_address_id:
          type: integer
          nullable: true
        gateway:
          type: string
          example: cashfree
        amount:
          type: string
          example: '20.0'
        currency:
          type: string
          example: INR
        status:
          "$ref": "#/components/schemas/PaymentStatus"
        payment_session_id:
          type: string
          nullable: true
        gateway_order_id:
          type: string
          nullable: true
    Order:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        cart_id:
          type: integer
        delivery_address_id:
          type: integer
          nullable: true
        status:
          "$ref": "#/components/schemas/OrderStatus"
        subtotal:
          type: string
        tax:
          type: string
        total:
          type: string
        order_items:
          type: array
          items:
            "$ref": "#/components/schemas/OrderItem"
        payment:
          "$ref": "#/components/schemas/Payment"
    OrderStatusRequest:
      type: object
      required:
      - status
      properties:
        status:
          "$ref": "#/components/schemas/OrderStatus"
    AdminMenuRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
        category_type:
          "$ref": "#/components/schemas/MenuCategoryType"
    AdminMenuCategoryRequest:
      type: object
      required:
      - name
      - menu_id
      properties:
        name:
          type: string
        menu_id:
          type: integer
        drink_type:
          nullable: true
          allOf:
          - "$ref": "#/components/schemas/DrinkType"
    AdminMenuItemRequest:
      type: object
      required:
      - name
      - price
      - menu_category_id
      properties:
        name:
          type: string
        description:
          type: string
        price:
          type: number
          example: 8.5
        menu_category_id:
          type: integer
        start_at:
          type: string
          format: date-time
          nullable: true
        end_at:
          type: string
          format: date-time
          nullable: true
        image_url:
          type: string
          nullable: true
    AdminCustomerRequest:
      type: object
      required:
      - first_name
      - last_name
      - email
      - phone
      - password
      properties:
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        additional_phone:
          type: string
          nullable: true
        password:
          type: string
          format: password
          description: Required when creating a customer. Omit it on update to keep
            the current password.
    AdminOrderUser:
      type: object
      properties:
        id:
          type: integer
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
        phone:
          type: string
        role:
          "$ref": "#/components/schemas/UserRole"
    AdminOrderPayment:
      type: object
      nullable: true
      properties:
        id:
          type: integer
        amount:
          type: string
        currency:
          type: string
        gateway:
          type: string
        status:
          "$ref": "#/components/schemas/PaymentStatus"
        gateway_order_id:
          type: string
          nullable: true
        gateway_payment_id:
          type: string
          nullable: true
    AdminOrder:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        cart_id:
          type: integer
        delivery_address_id:
          type: integer
          nullable: true
        status:
          "$ref": "#/components/schemas/OrderStatus"
        subtotal:
          type: string
        tax:
          type: string
        total:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        order_items:
          type: array
          items:
            "$ref": "#/components/schemas/OrderItem"
        payment:
          "$ref": "#/components/schemas/AdminOrderPayment"
        user:
          "$ref": "#/components/schemas/AdminOrderUser"
    Delivery:
      type: object
      properties:
        id:
          type: integer
        order_id:
          type: integer
        provider:
          type: string
          nullable: true
        status:
          "$ref": "#/components/schemas/DeliveryStatus"
        tracking_url:
          type: string
          nullable: true
        external_order_id:
          type: string
          nullable: true
    CheckoutRequest:
      type: object
      required:
      - cart_id
      - delivery_address_id
      properties:
        cart_id:
          type: integer
        delivery_address_id:
          type: integer
    CheckoutResponse:
      type: object
      properties:
        payment:
          type: object
          properties:
            id:
              type: integer
            gateway:
              type: string
            amount:
              type: string
            currency:
              type: string
            status:
              "$ref": "#/components/schemas/PaymentStatus"
            payment_session_id:
              type: string
              nullable: true
    PaymentReturn:
      type: object
      properties:
        message:
          type: string
        order_id:
          type: integer
          nullable: true
        gateway_order_id:
          type: string
    CashfreeWebhook:
      type: object
      properties:
        type:
          type: string
          example: PAYMENT_SUCCESS_WEBHOOK
        data:
          type: object
          properties:
            order:
              type: object
              properties:
                order_id:
                  type: string
                  description: Gateway order id stored on the payment, for example
                    CHECKOUT_1
                order_amount:
                  type: number
            payment:
              type: object
              properties:
                cf_payment_id:
                  type: integer
                payment_status:
                  type: string
                  enum:
                  - SUCCESS
                  - FAILED
                  - USER_DROPPED
                  - CANCELLED
                  - VOID
                  - PENDING
                  - NOT_ATTEMPTED
    Pagination:
      type: object
      required:
      - page
      - per_page
      - total_count
      - total_pages
      properties:
        page:
          type: integer
        per_page:
          type: integer
        total_count:
          type: integer
        total_pages:
          type: integer
    AdminTable:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        location:
          "$ref": "#/components/schemas/Location"
        capacity:
          type: integer
        available:
          type: boolean
          description: False when an active reservation overlaps the requested date
            and start_time. Those parameters default to the current time.
        active_reservations_count:
          type: integer
        released_count:
          type: integer
          description: Present on mark available. Number of reservations released.
    AdminTableRequest:
      type: object
      required:
      - name
      - location
      - capacity
      properties:
        name:
          type: string
        location:
          "$ref": "#/components/schemas/Location"
        capacity:
          type: integer
          minimum: 1
          maximum: 19
    AdminTableReservation:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          example: TableReservation
        location:
          "$ref": "#/components/schemas/Location"
        reservation_date:
          type: string
          format: date
        start_time:
          type: string
        estimated_end_time:
          type: string
        number_of_people:
          type: integer
          nullable: true
        full_name:
          type: string
        email:
          type: string
        phone:
          type: string
        occasion:
          type: string
          nullable: true
        special_requests:
          type: string
          nullable: true
        marketing_opt_in:
          type: boolean
        table_id:
          type: integer
        table_name:
          type: string
        active:
          type: boolean
        estimated_duration_minutes:
          type: integer
    AdminEstimatedDuration:
      type: object
      properties:
        estimated_duration_minutes:
          type: integer
          example: 120
        slot_minutes:
          type: integer
          example: 30
    AdminEstimatedDurationRequest:
      type: object
      required:
      - estimated_duration_minutes
      properties:
        estimated_duration_minutes:
          type: integer
          description: Dining window in minutes. A positive multiple of 30, up to 720.
          example: 120
  responses:
    NotFound:
      description: Record not found
    Unprocessable:
      description: Validation failed
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Errors"
    ServerError:
      description: Unexpected error
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
paths:
  "/api/v1/admin/menus":
    get:
      summary: List menus
      tags:
      - Admin menus
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
      - "$ref": "#/components/parameters/Page"
      - "$ref": "#/components/parameters/PerPage"
      responses:
        '200':
          description: menus returned
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - pagination
                properties:
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Menu"
                  pagination:
                    "$ref": "#/components/schemas/Pagination"
        '401':
          description: unauthorized
        '403':
          description: forbidden
    post:
      summary: Create a menu
      tags:
      - Admin menus
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
